spring:
  application:
    name: hr-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr}
    username: ${DB_USERNAME:hr}
    password: ${DB_PASSWORD:}  # empty default: credentials only ever come from the environment (rule 11)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks entities match it (rule 9)
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
